<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukishitaku — 季節の暮らし支度チェックリスト | YOUKOKU STUDIO</title>
<meta name="description" content="長野の四季にあわせた、暮らしの支度チェックリストアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%235c7a91%22>✓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101a22; --ink:#e4ecf1; --ink-soft:#8296a6; --line:#28394a;
  --accent:#6f92ac; --accent-soft:#1c2a35; --paper:#182530;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.8; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.6rem 8vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); }
.back:hover{ color:var(--ink); }
.applogo{ font-family:var(--serif); font-weight:400; font-size:1.1rem; display:flex; align-items:center; gap:.7rem; letter-spacing:.05em; }
.hanko{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.5rem; height:1.5rem; border-radius:42% 58% 61% 39% / 55% 42% 58% 45%;
  background:var(--accent); color:var(--bg);
  font-family:var(--serif); font-weight:500; font-size:.82rem; line-height:1; transform:rotate(-3deg); opacity:.94;
}

main{ max-width:600px; margin:0 auto; padding:3.4rem 8vw 5rem; }

.hero{ margin-bottom:2rem; }
.hero h1{ font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,4.4vw,1.9rem); margin:0 0 .7rem; letter-spacing:.02em; }
.hero p{ color:var(--ink-soft); margin:0; font-size:.88rem; }

.season-tabs{ display:flex; gap:1px; background:var(--line); margin-bottom:1.6rem; }
.season-tab{
  flex:1; background:var(--paper); border:none; color:var(--ink-soft); padding:.9rem .5rem; font-size:.85rem;
  transition:background .3s, color .3s;
}
.season-tab.active{ background:var(--accent); color:var(--bg); font-weight:500; }

.progress-row{ display:flex; align-items:center; gap:.8rem; margin-bottom:1.8rem; }
.progress-track{ flex:1; height:6px; background:var(--accent-soft); border-radius:3px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); transition:width .5s var(--ease); }
.progress-label{ font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }

.item-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); margin-bottom:1.6rem; }
.item{ background:var(--paper); padding:1rem 1.1rem; display:flex; align-items:center; gap:.9rem; }
.item-check{
  width:22px; height:22px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:.7rem;
  transition:background .2s, border-color .2s;
}
.item-check.done{ background:var(--accent); border-color:var(--accent); }
.item-text{ flex:1; font-size:.88rem; }
.item.done .item-text{ color:var(--ink-soft); text-decoration:line-through; }
.item-del{ border:none; background:none; color:var(--ink-soft); opacity:.4; font-size:.85rem; padding:.2rem; }
.item-del:hover{ opacity:1; color:#c96a5a; }

.add-form{ display:flex; gap:.6rem; }
.add-form input{
  flex:1; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  padding:.75rem 1rem; font-size:.88rem; outline:none;
}
.add-form input:focus{ border-color:var(--accent); }
.add-form button{
  border:1px solid var(--accent); background:transparent; color:var(--accent); padding:0 1.3rem;
  font-size:.8rem; transition:background .3s, color .3s;
}
.add-form button:hover{ background:var(--accent); color:var(--bg); }
</style>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back">← Yukishitaku について</a>
  <div class="applogo"><span class="hanko">雪</span>Yukishitaku</div>
</header>

<main>
  <div class="hero">
    <h1>今の季節の支度は?</h1>
    <p>四季の変わり目にやることを、チェックしながら進めましょう。</p>
  </div>

  <div class="season-tabs" id="seasonTabs">
    <button class="season-tab" data-season="spring">春</button>
    <button class="season-tab" data-season="summer">夏</button>
    <button class="season-tab" data-season="autumn">秋</button>
    <button class="season-tab" data-season="winter">冬</button>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 0</span>
  </div>

  <div class="item-list" id="itemList"></div>

  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" placeholder="項目を追加(例: 玄関マットを冬用に)" maxlength="40" required>
    <button type="submit">追加</button>
  </form>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'yukishitaku_v1';

  const DEFAULTS = {
    spring: [
      '冬用タイヤをノーマルタイヤに戻す',
      '除雪道具を片付ける',
      '花粉対策グッズを準備する',
      '換気口・網戸を掃除する',
    ],
    summer: [
      '扇風機・エアコンを点検する',
      '網戸の破れを確認する',
      '熱中症対策グッズを用意する',
      '側溝・排水路を掃除する(台風前)',
    ],
    autumn: [
      '灯油を注文する',
      '冬服・布団を出す',
      'スタッドレスタイヤ交換を予約する',
      '台風・霜対策をする',
    ],
    winter: [
      'スタッドレスタイヤに交換する',
      '灯油・燃料の残量を確認する',
      '水道管の凍結対策をする',
      '除雪道具を点検する',
      '玄関に融雪剤を用意する',
    ],
  };
  const SEASON_LABEL = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };

  function currentSeason() {
    const m = new Date().getMonth() + 1;
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }

  function loadData() {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (raw) return raw;
    const data = {};
    for (const season of Object.keys(DEFAULTS)) {
      data[season] = DEFAULTS[season].map((text, i) => ({ id: `${season}-${i}`, text, done: false }));
    }
    return data;
  }

  let data = loadData();
  let season = currentSeason();
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(data));

  function renderTabs() {
    document.querySelectorAll('.season-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.season === season);
    });
  }

  function render() {
    renderTabs();
    const items = data[season] || [];
    const done = items.filter((it) => it.done).length;
    document.getElementById('progressLabel').textContent = `${done} / ${items.length}`;
    document.getElementById('progressFill').style.width = items.length ? `${(done / items.length) * 100}%` : '0%';

    document.getElementById('itemList').innerHTML = items.map((it) => `
      <div class="item ${it.done ? 'done' : ''}">
        <button class="item-check ${it.done ? 'done' : ''}" data-id="${it.id}" aria-label="完了">${it.done ? '✓' : ''}</button>
        <span class="item-text">${escapeHtml(it.text)}</span>
        <button class="item-del" data-del="${it.id}" aria-label="削除">✕</button>
      </div>
    `).join('') || `<div class="item"><span class="item-text">${SEASON_LABEL[season]}の項目はまだありません。</span></div>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  document.getElementById('seasonTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.season-tab');
    if (!btn) return;
    season = btn.dataset.season;
    render();
  });

  document.getElementById('itemList').addEventListener('click', (e) => {
    const check = e.target.closest('.item-check');
    if (check) {
      const item = data[season].find((it) => it.id === check.dataset.id);
      item.done = !item.done;
      save();
      render();
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      data[season] = data[season].filter((it) => it.id !== del.dataset.del);
      save();
      render();
    }
  });

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('itemInput');
    const text = input.value.trim();
    if (!text) return;
    data[season] = data[season] || [];
    data[season].push({ id: season + '-' + Date.now().toString(36), text, done: false });
    input.value = '';
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
