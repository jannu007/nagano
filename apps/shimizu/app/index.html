<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shimizu — 水分補給リマインダー | YOUKOKU STUDIO</title>
<meta name="description" content="山の湧き水をイメージした、毎日の水分補給をやさしく記録するリマインダーアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%233f7ea6%22>○</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf1f4; --ink:#16232b; --ink-soft:#6d8496; --line:#cddce3;
  --accent:#3f7ea6; --accent-soft:#dbe9f0; --paper:#f4f9fb;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.8; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.6rem 8vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); }
.back:hover{ color:var(--ink); }
.applogo{ font-family:var(--serif); font-weight:400; font-size:1.1rem; display:flex; align-items:center; gap:.7rem; letter-spacing:.05em; }
.hanko{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.5rem; height:1.5rem; border-radius:42% 58% 61% 39% / 55% 42% 58% 45%;
  background:var(--accent); color:var(--paper);
  font-family:var(--serif); font-weight:500; font-size:.82rem; line-height:1; transform:rotate(-3deg); opacity:.94;
}

main{ max-width:560px; margin:0 auto; padding:3.4rem 8vw 5rem; }

.hero{ margin-bottom:2.4rem; text-align:center; }
.hero h1{ font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,4.4vw,1.9rem); margin:0 0 .7rem; letter-spacing:.02em; }
.hero p{ color:var(--ink-soft); margin:0; font-size:.88rem; }

.tank-wrap{ display:flex; justify-content:center; margin-bottom:2rem; }
.tank{
  position:relative; width:150px; height:190px; border:2px solid var(--line); border-radius:16px 16px 20px 20px;
  overflow:hidden; background:var(--paper);
}
.tank-water{
  position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(180deg, var(--accent), #2c5f80);
  transition:height 1s var(--ease);
}
.tank-water::before{
  content:''; position:absolute; top:-6px; left:0; width:200%; height:14px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 24px, transparent 24px 48px);
  border-radius:50%; animation:wave 3.2s linear infinite;
}
@keyframes wave{ from{ transform:translateX(0); } to{ transform:translateX(-48px); } }
.tank-label{
  position:relative; z-index:1; height:100%; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:.2rem;
}
.tank-pct{ font-family:var(--serif); font-size:1.9rem; font-weight:400; }
.tank-sub{ font-size:.7rem; letter-spacing:.05em; }

.summary{ display:flex; gap:1px; margin-bottom:2rem; background:var(--line); }
.summary-card{ flex:1; background:var(--paper); padding:1.1rem 1rem; text-align:center; }
.summary-num{ font-family:var(--serif); font-size:1.6rem; font-weight:400; color:var(--accent); font-variant-numeric:tabular-nums; }
.summary-label{ font-size:.68rem; color:var(--ink-soft); letter-spacing:.05em; }

.controls{ display:flex; align-items:center; justify-content:center; gap:1.4rem; margin-bottom:1.6rem; }
.add-btn{
  width:4.6rem; height:4.6rem; border-radius:50%; border:1px solid var(--accent); background:var(--accent);
  color:#fff; font-size:.82rem; letter-spacing:.02em; box-shadow:0 8px 20px rgba(63,126,166,.28);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.add-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(63,126,166,.36); }
.add-btn:active{ transform:translateY(0); }
.minor-btn{
  width:2.6rem; height:2.6rem; border-radius:50%; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-size:1rem;
}
.minor-btn:hover{ border-color:var(--accent); color:var(--accent); }

.goal-row{ display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:2.6rem; font-size:.8rem; color:var(--ink-soft); }
.goal-row input{
  width:3.2rem; text-align:center; border:1px solid var(--line); background:var(--paper); padding:.4rem; font-size:.85rem;
}

.week h2{ font-family:var(--serif); font-weight:400; font-size:1rem; margin:0 0 1.1rem; text-align:center; }
.week-grid{ display:flex; justify-content:space-between; gap:.5rem; }
.week-day{ display:flex; flex-direction:column; align-items:center; gap:.5rem; flex:1; }
.week-bar-track{ width:100%; height:80px; background:var(--accent-soft); border-radius:6px; position:relative; overflow:hidden; }
.week-bar-fill{ position:absolute; bottom:0; left:0; width:100%; background:var(--accent); border-radius:6px 6px 0 0; }
.week-day.today .week-bar-track{ box-shadow:0 0 0 1px var(--accent); }
.week-day span{ font-size:.66rem; color:var(--ink-soft); }
</style>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back">← Shimizu について</a>
  <div class="applogo"><span class="hanko">水</span>Shimizu</div>
</header>

<main>
  <div class="hero">
    <h1>今日も、ひと口。</h1>
    <p>コップ1杯を飲んだらタップ。無理せず続けられる水分補給の記録です。</p>
  </div>

  <div class="tank-wrap">
    <div class="tank">
      <div class="tank-water" id="tankWater"></div>
      <div class="tank-label">
        <span class="tank-pct" id="tankPct">0%</span>
        <span class="tank-sub" id="tankSub">0 / 8 杯</span>
      </div>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-num" id="statStreak">0</div>
      <div class="summary-label">達成日数 STREAK</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="statTotal">0</div>
      <div class="summary-label">今週の合計 杯</div>
    </div>
  </div>

  <div class="controls">
    <button class="minor-btn" id="minusBtn" aria-label="1杯減らす">−</button>
    <button class="add-btn" id="plusBtn">+1杯</button>
    <button class="minor-btn" id="resetBtn" aria-label="今日をリセット">↺</button>
  </div>

  <div class="goal-row">
    <span>1日の目標</span>
    <input type="number" id="goalInput" min="1" max="20" value="8">
    <span>杯</span>
  </div>

  <div class="week">
    <h2>今週の記録</h2>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'shimizu_log_v1';
  const GOAL_KEY = 'shimizu_goal_v1';
  const DAY_MS = 86400000;

  const toDateStr = (d) => {
    const yy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return `${yy}-${mm}-${dd}`;
  };
  const today = () => toDateStr(new Date());
  const last7 = () => {
    const arr = [];
    for (let i = 6; i >= 0; i--) arr.push(toDateStr(new Date(Date.now() - i*DAY_MS)));
    return arr;
  };
  const dayLabel = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    return ['日','月','火','水','木','金','土'][d.getDay()];
  };

  let log = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  let goal = parseInt(localStorage.getItem(GOAL_KEY) || '8', 10);
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(log));
  const saveGoal = () => localStorage.setItem(GOAL_KEY, String(goal));

  function calcStreak() {
    let streak = 0;
    let cursor = new Date();
    while (true) {
      const key = toDateStr(cursor);
      if ((log[key] || 0) >= goal) {
        streak++;
        cursor = new Date(cursor.getTime() - DAY_MS);
      } else if (key === today()) {
        cursor = new Date(cursor.getTime() - DAY_MS);
      } else {
        break;
      }
    }
    return streak;
  }

  function render() {
    const count = log[today()] || 0;
    const pct = Math.min(100, Math.round((count / goal) * 100));
    document.getElementById('tankWater').style.height = pct + '%';
    document.getElementById('tankPct').textContent = pct + '%';
    document.getElementById('tankSub').textContent = `${count} / ${goal} 杯`;
    document.getElementById('statStreak').textContent = calcStreak();

    const days = last7();
    const t = today();
    let weekTotal = 0;
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = days.map((d) => {
      const c = log[d] || 0;
      weekTotal += c;
      const barPct = Math.min(100, Math.round((c / goal) * 100));
      return `
        <div class="week-day ${d === t ? 'today' : ''}">
          <div class="week-bar-track"><div class="week-bar-fill" style="height:${barPct}%"></div></div>
          <span>${dayLabel(d)}</span>
        </div>
      `;
    }).join('');
    document.getElementById('statTotal').textContent = weekTotal;
  }

  document.getElementById('plusBtn').addEventListener('click', () => {
    const t = today();
    log[t] = (log[t] || 0) + 1;
    save();
    render();
  });
  document.getElementById('minusBtn').addEventListener('click', () => {
    const t = today();
    log[t] = Math.max(0, (log[t] || 0) - 1);
    save();
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    const t = today();
    log[t] = 0;
    save();
    render();
  });
  document.getElementById('goalInput').addEventListener('change', (e) => {
    goal = Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 8));
    e.target.value = goal;
    saveGoal();
    render();
  });

  document.getElementById('goalInput').value = goal;
  render();
})();
</script>
</body>
</html>
