<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouen Note — 家庭菜園ノート | YOUKOKU STUDIO</title>
<meta name="description" content="長野の家庭菜園・小さな畑の世話を記録する栽培ノートアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%235f8a4a%22>▽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2e4; --ink:#1f2a17; --ink-soft:#77876b; --line:#d7ddc7;
  --accent:#5f8a4a; --accent-soft:#e1e8d4; --paper:#f5f8ee;
  --warn:#b0703a;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.8; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.6rem 8vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); }
.back:hover{ color:var(--ink); }
.applogo{ font-family:var(--serif); font-weight:400; font-size:1.1rem; display:flex; align-items:center; gap:.7rem; letter-spacing:.05em; }
.hanko{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.5rem; height:1.5rem; border-radius:42% 58% 61% 39% / 55% 42% 58% 45%;
  background:var(--accent); color:var(--paper);
  font-family:var(--serif); font-weight:500; font-size:.82rem; line-height:1; transform:rotate(-3deg); opacity:.94;
}

main{ max-width:620px; margin:0 auto; padding:3.4rem 8vw 5rem; }

.hero{ margin-bottom:2rem; }
.hero h1{ font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,4.4vw,1.9rem); margin:0 0 .7rem; letter-spacing:.02em; }
.hero p{ color:var(--ink-soft); margin:0; font-size:.88rem; }

.add-form{
  display:flex; flex-direction:column; gap:.7rem; background:var(--paper); border:1px solid var(--line);
  padding:1.3rem; margin-bottom:2.2rem;
}
.add-form input{
  border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:.7rem .9rem; font-size:.86rem; outline:none;
}
.add-form input:focus{ border-color:var(--accent); }
.form-row{ display:flex; gap:.6rem; }
.form-row > *{ flex:1; }
.form-row label{ font-size:.72rem; color:var(--ink-soft); display:block; margin-bottom:.3rem; }
.add-form button[type="submit"]{
  border:1px solid var(--accent); background:var(--accent); color:var(--paper); padding:.8rem; font-size:.85rem; letter-spacing:.03em;
}

.plant-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); }
.plant-card{ background:var(--paper); padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.5rem; }
.plant-top{ display:flex; align-items:baseline; justify-content:space-between; gap:.8rem; }
.plant-name{ font-family:var(--serif); font-size:1.05rem; }
.plant-meta{ font-size:.72rem; color:var(--ink-soft); }
.plant-water-status{ font-size:.82rem; }
.plant-water-status.due{ color:var(--warn); font-weight:500; }
.plant-water-status.ok{ color:var(--accent); }
.plant-actions{ display:flex; gap:.6rem; margin-top:.3rem; }
.plant-actions button{
  border:1px solid var(--line); background:transparent; color:var(--ink-soft); padding:.4rem .9rem; font-size:.76rem;
}
.plant-actions .water-btn{ border-color:var(--accent); color:var(--accent); }
.plant-actions .water-btn:hover{ background:var(--accent); color:var(--paper); }
.plant-actions .del-btn:hover{ border-color:#c96a5a; color:#c96a5a; }

.empty{ text-align:center; padding:3rem 1rem; color:var(--ink-soft); font-size:.86rem; border:1px solid var(--line); }
</style>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back">← Nouen Note について</a>
  <div class="applogo"><span class="hanko">苗</span>Nouen Note</div>
</header>

<main>
  <div class="hero">
    <h1>今日の畑仕事は?</h1>
    <p>育てているものを登録すると、水やりの目安を自動で計算します。</p>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="nameInput" placeholder="野菜・花の名前(例: ミニトマト)" maxlength="30" required>
    <div class="form-row">
      <div>
        <label>植え付け日</label>
        <input type="date" id="plantedInput" required>
      </div>
      <div>
        <label>水やりの間隔(日)</label>
        <input type="number" id="intervalInput" min="1" max="30" value="3" required>
      </div>
    </div>
    <button type="submit">登録する</button>
  </form>

  <div class="plant-list" id="plantList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    まだ何も登録されていません。育てているものを登録してみましょう。
  </div>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'nouen_note_v1';
  const DAY_MS = 86400000;

  let plants = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(plants));

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }
  function daysSince(dateStr) {
    const then = new Date(dateStr + 'T00:00:00').getTime();
    const now = new Date(new Date().toDateString()).getTime();
    return Math.round((now - then) / DAY_MS);
  }

  function render() {
    const list = document.getElementById('plantList');
    const empty = document.getElementById('emptyState');
    empty.style.display = plants.length ? 'none' : 'block';

    list.innerHTML = plants.map((p) => {
      const elapsed = daysSince(p.lastWatered);
      const remaining = p.interval - elapsed;
      const statusText = remaining <= 0
        ? (remaining === 0 ? '今日が水やりの目安です' : `水やりの目安を${-remaining}日過ぎています`)
        : `次の水やりまであと${remaining}日`;
      const statusClass = remaining <= 0 ? 'due' : 'ok';
      return `
        <div class="plant-card">
          <div class="plant-top">
            <span class="plant-name">${escapeHtml(p.name)}</span>
            <span class="plant-meta">植え付け ${formatDate(p.planted)}</span>
          </div>
          <div class="plant-water-status ${statusClass}">${statusText}</div>
          <div class="plant-actions">
            <button class="water-btn" data-water="${p.id}">水やりした</button>
            <button class="del-btn" data-del="${p.id}">削除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const planted = document.getElementById('plantedInput').value;
    const interval = Math.max(1, parseInt(document.getElementById('intervalInput').value, 10) || 3);
    if (!name || !planted) return;

    plants.push({
      id: Date.now().toString(36),
      name,
      planted,
      interval,
      lastWatered: planted,
    });
    save();
    e.target.reset();
    document.getElementById('plantedInput').value = new Date().toISOString().slice(0, 10);
    document.getElementById('intervalInput').value = 3;
    render();
  });

  document.getElementById('plantList').addEventListener('click', (e) => {
    const water = e.target.closest('[data-water]');
    if (water) {
      const p = plants.find((pl) => pl.id === water.dataset.water);
      p.lastWatered = new Date().toISOString().slice(0, 10);
      save();
      render();
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      plants = plants.filter((pl) => pl.id !== del.dataset.del);
      save();
      render();
    }
  });

  document.getElementById('plantedInput').value = new Date().toISOString().slice(0, 10);
  render();
})();
</script>
</body>
</html>
