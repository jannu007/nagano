<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onsen Techo — 温泉訪問手帖 | YOUKOKU STUDIO</title>
<meta name="description" content="信州の名湯めぐりを記録する、シンプルな温泉訪問手帖アプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23c9724a%22>♨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c130e; --ink:#ece1d6; --ink-soft:#a08e7d; --line:#3a2c22;
  --accent:#c9724a; --accent-soft:#2e2019; --paper:#241a14;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.8; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input,textarea,select{ font-family:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.6rem 8vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); }
.back:hover{ color:var(--ink); }
.applogo{ font-family:var(--serif); font-weight:400; font-size:1.1rem; display:flex; align-items:center; gap:.7rem; letter-spacing:.05em; }
.hanko{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.5rem; height:1.5rem; border-radius:42% 58% 61% 39% / 55% 42% 58% 45%;
  background:var(--accent); color:var(--bg);
  font-family:var(--serif); font-weight:500; font-size:.82rem; line-height:1; transform:rotate(-3deg); opacity:.94;
}

main{ max-width:600px; margin:0 auto; padding:3.4rem 8vw 5rem; }

.hero{ margin-bottom:2rem; }
.hero h1{ font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,4.4vw,1.9rem); margin:0 0 .7rem; letter-spacing:.02em; }
.hero p{ color:var(--ink-soft); margin:0; font-size:.88rem; }

.summary{ display:flex; gap:1px; margin-bottom:2.2rem; background:var(--line); }
.summary-card{ flex:1; background:var(--paper); padding:1.1rem 1rem; text-align:center; }
.summary-num{ font-family:var(--serif); font-size:1.6rem; font-weight:400; color:var(--accent); font-variant-numeric:tabular-nums; }
.summary-label{ font-size:.68rem; color:var(--ink-soft); letter-spacing:.05em; }

.entry-form{
  display:flex; flex-direction:column; gap:.8rem; background:var(--paper); border:1px solid var(--line);
  padding:1.4rem; margin-bottom:2.2rem;
}
.entry-form input, .entry-form textarea{
  border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:.7rem .9rem; font-size:.86rem; outline:none;
}
.entry-form input:focus, .entry-form textarea:focus{ border-color:var(--accent); }
.form-row{ display:flex; gap:.6rem; }
.form-row > *{ flex:1; }
.star-row{ display:flex; gap:.4rem; }
.star-btn{ border:none; background:none; font-size:1.4rem; color:var(--line); }
.star-btn.on{ color:var(--accent); }
.entry-form button[type="submit"]{
  border:1px solid var(--accent); background:var(--accent); color:var(--bg); padding:.8rem; font-size:.85rem; letter-spacing:.03em;
}

.entry-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); }
.entry-card{ background:var(--paper); padding:1.1rem 1.2rem; }
.entry-top{ display:flex; align-items:baseline; justify-content:space-between; gap:.8rem; margin-bottom:.3rem; }
.entry-name{ font-family:var(--serif); font-size:1.05rem; }
.entry-date{ font-size:.7rem; color:var(--ink-soft); flex-shrink:0; }
.entry-stars{ color:var(--accent); font-size:.8rem; margin-bottom:.4rem; }
.entry-notes{ font-size:.85rem; color:var(--ink-soft); margin:0 0 .5rem; white-space:pre-wrap; }
.entry-del{ border:none; background:none; color:var(--ink-soft); opacity:.4; font-size:.78rem; }
.entry-del:hover{ opacity:1; color:#c96a5a; }

.empty{ text-align:center; padding:3rem 1rem; color:var(--ink-soft); font-size:.86rem; border:1px solid var(--line); }
</style>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back">← Onsen Techo について</a>
  <div class="applogo"><span class="hanko">泉</span>Onsen Techo</div>
</header>

<main>
  <div class="hero">
    <h1>次はどの名湯へ。</h1>
    <p>訪れた温泉を、名前・泉質・感想とともに記録しましょう。</p>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-num" id="statTotal">0</div>
      <div class="summary-label">訪問した温泉</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="statAvg">-</div>
      <div class="summary-label">平均評価</div>
    </div>
  </div>

  <form class="entry-form" id="entryForm">
    <div class="form-row">
      <input type="text" id="nameInput" placeholder="温泉名(例: 白骨温泉)" maxlength="40" required>
      <input type="date" id="dateInput" required>
    </div>
    <input type="text" id="qualityInput" placeholder="泉質・特徴(任意、例: 硫黄泉・にごり湯)" maxlength="60">
    <div class="star-row" id="starRow">
      <button type="button" class="star-btn" data-star="1">★</button>
      <button type="button" class="star-btn" data-star="2">★</button>
      <button type="button" class="star-btn" data-star="3">★</button>
      <button type="button" class="star-btn" data-star="4">★</button>
      <button type="button" class="star-btn" data-star="5">★</button>
    </div>
    <textarea id="notesInput" placeholder="感想・メモ(任意)" rows="2" maxlength="200"></textarea>
    <button type="submit">記録する</button>
  </form>

  <div class="entry-list" id="entryList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    まだ記録がありません。最初の一湯を記録してみましょう。
  </div>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'onsen_techo_v1';

  let entries = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(entries));
  let rating = 0;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderStars() {
    document.querySelectorAll('.star-btn').forEach((btn) => {
      btn.classList.toggle('on', parseInt(btn.dataset.star, 10) <= rating);
    });
  }

  function render() {
    const list = document.getElementById('entryList');
    const empty = document.getElementById('emptyState');
    const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date));
    empty.style.display = sorted.length ? 'none' : 'block';

    list.innerHTML = sorted.map((en) => `
      <div class="entry-card">
        <div class="entry-top">
          <span class="entry-name">${escapeHtml(en.name)}</span>
          <span class="entry-date">${formatDate(en.date)}</span>
        </div>
        <div class="entry-stars">${'★'.repeat(en.rating)}${'☆'.repeat(5 - en.rating)}${en.quality ? ' ・ ' + escapeHtml(en.quality) : ''}</div>
        ${en.notes ? `<p class="entry-notes">${escapeHtml(en.notes)}</p>` : ''}
        <button class="entry-del" data-del="${en.id}">削除</button>
      </div>
    `).join('');

    document.getElementById('statTotal').textContent = entries.length;
    const avg = entries.length ? (entries.reduce((s, en) => s + en.rating, 0) / entries.length) : 0;
    document.getElementById('statAvg').textContent = entries.length ? avg.toFixed(1) : '-';
  }

  document.getElementById('starRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.star-btn');
    if (!btn) return;
    rating = parseInt(btn.dataset.star, 10);
    renderStars();
  });

  document.getElementById('entryForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const date = document.getElementById('dateInput').value;
    if (!name || !date) return;

    entries.push({
      id: Date.now().toString(36),
      name,
      date,
      quality: document.getElementById('qualityInput').value.trim(),
      rating,
      notes: document.getElementById('notesInput').value.trim(),
    });
    save();

    e.target.reset();
    rating = 0;
    renderStars();
    document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
    render();
  });

  document.getElementById('entryList').addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if (!del) return;
    entries = entries.filter((en) => en.id !== del.dataset.del);
    save();
    render();
  });

  document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
  renderStars();
  render();
})();
</script>
</body>
</html>
